# Adapted from https://github.com/Molmed/sis_style_checksums_nextflow/blob/main/.github/workflows/nf-test.yml
name: Run nf-test

on:
  push:
  pull_request:

env:
  NXF_ANSI_LOG: false
  NFT_VER: "0.9.0"
  NFT_WORKDIR: "~"
  NFT_DIFF: "pdiff"
  NFT_DIFF_ARGS: "--line-numbers --expand-tabs=2"

jobs:
  test:
    name: Run nf-tests and pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Check out pipeline code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v4
        with:
          python-version: "3.14"

      - name: Install pdiff to see diff between nf-test snapshots
        run: |
          python -m pip install --upgrade pip
          pip install pdiff

      - name: Setup Nextflow latest-stable
        uses: nf-core/setup-nextflow@v3
        with:
          version: "latest-stable"

      - name: Install nf-test
        run: |
          wget -qO- https://get.nf-test.com | bash
          sudo mv nf-test /usr/local/bin/

      - name: Run Tests
        run: |
          nf-test test --ci
      
      - name: Save test output for troubleshooting
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          path: "${{ github.workspace}}/.nf-test/tests"
